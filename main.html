<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happ — Подключение подписки</title>
<meta name="theme-color" content="#070b12">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #070b12;
    --card:     rgba(255,255,255,0.045);
    --stroke:   rgba(255,255,255,0.09);
    --text:     #eef3fb;
    --muted:    #8b9bb4;
    --accent:   #00e5a0;
    --accent-2: #3d7bff;
    --danger:   #ff5c72;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* фоновые свечения */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
    animation: float 18s ease-in-out infinite;
  }
  .orb-1 { width: 460px; height: 460px; background: #00e5a0; opacity: .38; top: -170px; left: -150px; }
  .orb-2 { width: 400px; height: 400px; background: #3d7bff; opacity: .35; bottom: -150px; right: -120px; animation-delay: -6s; }

  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(30px,-25px) scale(1.08); }
  }

  .grid-overlay {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, #000 10%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, #000 10%, transparent 75%);
  }

  /* контент */
  .wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* текст над кнопкой */
  .hint {
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
    margin-bottom: 38px;
    max-width: 320px;
  }
  .hint b { color: var(--text); font-weight: 700; }

  /* кнопка */
  .connect-wrap {
    position: relative;
    width: 178px; height: 178px;
    display: grid; place-items: center;
    margin-bottom: 26px;
  }

  .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(0,229,160,.35);
    animation: pulse 3s ease-out infinite;
  }
  .ring:nth-child(2) { animation-delay: 1s; }
  .ring:nth-child(3) { animation-delay: 2s; }

  @keyframes pulse {
    0%   { transform: scale(.78); opacity: 0; }
    35%  { opacity: .85; }
    100% { transform: scale(1.14); opacity: 0; }
  }

  .connect-btn {
    position: relative;
    width: 138px; height: 138px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    color: #04140e;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .3px;
    background: linear-gradient(150deg, #35ffc0 0%, var(--accent) 45%, #00b8ff 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.18) inset,
      0 12px 40px -6px rgba(0,229,160,.55),
      0 0 70px -12px rgba(0,229,160,.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .connect-btn svg { width: 30px; height: 30px; }
  .connect-btn:hover  { transform: scale(1.045); }
  .connect-btn:active { transform: scale(.965); }
  .connect-btn.loading { pointer-events: none; }
  .connect-btn.loading .btn-label { opacity: .55; }

  .spinner {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #fff;
    border-right-color: rgba(255,255,255,.5);
    opacity: 0;
    transition: opacity .2s;
  }
  .connect-btn.loading .spinner { opacity: 1; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* кнопка копирования */
  .copy-btn {
    width: 100%;
    max-width: 300px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--stroke);
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: background .2s, border-color .2s, transform .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .copy-btn:hover  { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.18); }
  .copy-btn:active { transform: scale(.985); }
  .copy-btn svg { width: 16px; height: 16px; opacity: .8; }

  /* статус-строка (одна, внизу) */
  .device-info {
    position: fixed;
    left: 0; right: 0;
    bottom: 22px;
    z-index: 3;
    display: flex;
    justify-content: center;
    padding: 0 20px;
    pointer-events: none;
  }
  .device-pill {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    padding: 9px 16px;
    border-radius: 100px;
    background: rgba(13,20,32,.7);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: color .3s, border-color .3s;
  }
  .device-pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    transition: background .3s, box-shadow .3s;
  }
  .device-pill.ok  { color: var(--accent); border-color: rgba(0,229,160,.35); }
  .device-pill.ok .dot  { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .device-pill.err { color: var(--danger); border-color: rgba(255,92,114,.35); }
  .device-pill.err .dot { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

  /* тост */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 84px;
    transform: translate(-50%, 20px);
    background: rgba(13,20,32,.94);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(20px);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 100px;
    box-shadow: 0 18px 44px -12px rgba(0,0,0,.9);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 99;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 360px) {
    .connect-wrap { width: 158px; height: 158px; }
    .connect-btn  { width: 124px; height: 124px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="grid-overlay"></div>

<div class="wrap">

  <p class="hint">Нажмите на кнопку, чтобы <b>подписка</b> добавилась в приложение <b>Happ</b></p>

  <div class="connect-wrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>

    <button class="connect-btn" id="connectBtn" aria-label="Добавить подписку в Happ">
      <span class="spinner"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span class="btn-label" id="btnLabel">Подключить</span>
    </button>
  </div>

  <button class="copy-btn" id="copyBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="12" height="12" rx="2.5"/>
      <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
    </svg>
    Скопировать ссылку подписки
  </button>

</div>

<div class="device-info">
  <div class="device-pill" id="devicePill">
    <span class="dot"></span>
    <span id="deviceText">Определение устройства…</span>
  </div>
</div>

<div class="toast" id="toast">Ссылка скопирована</div>

<script>
/* =========================================================
   НАСТРОЙКИ — замените на свою ссылку подписки
   ========================================================= */
const SUBSCRIPTION_URL = "https://example.com/sub/your-token-here";

/* ========================================================= */

const btn        = document.getElementById("connectBtn");
const btnLabel   = document.getElementById("btnLabel");
const copyBtn    = document.getElementById("copyBtn");
const toast      = document.getElementById("toast");
const devicePill = document.getElementById("devicePill");
const deviceText = document.getElementById("deviceText");

/* ---------- ОПРЕДЕЛЕНИЕ УСТРОЙСТВА ---------- */
function detectDevice() {
  const ua = navigator.userAgent || "";
  const platform = navigator.platform || "";

  const isIOS =
    /iPad|iPhone|iPod/.test(ua) ||
    (platform === "MacIntel" && navigator.maxTouchPoints > 1);

  const isAndroid = /Android/i.test(ua);
  const isMobile = isIOS || isAndroid || /Mobile|Windows Phone/i.test(ua);
  const isDesktop = !isMobile;

  let os = "Компьютер";
  if (isIOS) os = "iOS";
  else if (isAndroid) os = "Android";
  else if (/Mac/i.test(platform)) os = "macOS";
  else if (/Win/i.test(platform)) os = "Windows";
  else if (/Linux/i.test(platform)) os = "Linux";

  return { isIOS, isAndroid, isMobile, isDesktop, os };
}

const DEVICE = detectDevice();

/* Показываем определённое устройство в статус-строке */
(function showDevice() {
  if (DEVICE.isMobile) {
    deviceText.textContent = "Устройство: " + DEVICE.os + " — приложение откроется автоматически";
  } else {
    deviceText.textContent = "Устройство: " + DEVICE.os + " — ссылка будет скопирована";
  }
})();

/* ---------- DEEP LINK ---------- */
function buildDeepLink() {
  /* Happ принимает ссылку вида: happ://add/<URL_ПОДПИСКИ> */
  return "happ://add/" + SUBSCRIPTION_URL;
}

/* ---------- УТИЛИТЫ ---------- */
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

function setDeviceState(type) {
  devicePill.className = "device-pill" + (type ? " " + type : "");
}

/* ---------- КНОПКА ПОДКЛЮЧЕНИЯ ---------- */
btn.addEventListener("click", () => {
  let appOpened = false;

  btn.classList.add("loading");
  btnLabel.textContent = "Открываем…";

  /* Мобильные — открываем приложение через deep-link */
  if (DEVICE.isMobile) {
    try {
      window.location.href = buildDeepLink();
    } catch (e) {
      console.warn("Deep link error:", e);
    }

    /* Если вкладка ушла в фон — приложение открылось */
    setTimeout(() => {
      if (document.hidden) {
        appOpened = true;
        btn.classList.remove("loading");
        btnLabel.textContent = "Подключено";
        setDeviceState("ok");
        deviceText.textContent = "Happ открыт — подтвердите добавление подписки";
      }
    }, 900);

    /* Fallback: приложение не открылось */
    setTimeout(() => {
      if (appOpened || document.hidden) return;
      btn.classList.remove("loading");
      btnLabel.textContent = "Подключить";
      setDeviceState("err");
      deviceText.textContent = "Приложение Happ не найдено на устройстве";
      showToast("Установите Happ и попробуйте снова");
    }, 2500);

  /* Десктоп — копируем ссылку */
  } else {
    setTimeout(() => {
      btn.classList.remove("loading");
      btnLabel.textContent = "Ссылка готова";
      setDeviceState("ok");
      deviceText.textContent = "Ссылка скопирована — вставьте её в Happ";
      copyToClipboard(SUBSCRIPTION_URL);
    }, 500);
  }
});

/* ---------- КОПИРОВАНИЕ ---------- */
function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(
      () => showToast("Ссылка скопирована"),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    showToast("Ссылка скопирована");
  } catch {
    showToast("Не удалось скопировать");
  }
  document.body.removeChild(ta);
}

copyBtn.addEventListener("click", () => copyToClipboard(SUBSCRIPTION_URL));

/* ---------- ВОЗВРАТ НА ВКЛАДКУ ---------- */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && btn.classList.contains("loading")) {
    btn.classList.remove("loading");
    btnLabel.textContent = "Подключено";
    setDeviceState("ok");
    deviceText.textContent = "Подписка добавлена в Happ";
  }
});
</script>
</body>
</html>
